<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>NMS | National Project 2026</title>

    <style>

        /* ==============================
           خط ثمانية
        ============================== */

        @font-face {
            font-family: "Thmanyah";
            src: url("Thmanyah-Font-Family/thmanyahSans-Bold.woff2")
                 format("woff2");
            font-weight: 700;
            font-style: normal;
            font-display: swap;
        }


        /* ==============================
           إعداد الصفحة
        ============================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        html,
        body {
            width: 100%;
            min-height: 100%;
        }


        body {
            font-family: "Thmanyah", Arial, sans-serif;

            background: #07140f;

            display: flex;
            justify-content: center;
            align-items: center;

            min-height: 100vh;

            overflow-x: hidden;
        }


        /* ==============================
           الصفحة الرئيسية
        ============================== */

        .page {

            position: relative;

            width: 100%;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 40px 22px;

            overflow: hidden;

            isolation: isolate;
        }


        /* ==============================
           صورة سيارة الأمن
        ============================== */

        .background {

            position: absolute;

            inset: 0;

            background-image:
                url("police-background.jpeg");

            background-size: cover;

            background-position: center 62% 10%;

            z-index: -4;

            transform: scale(1.04);

            animation:
                backgroundEnter 1.8s ease-out forwards;
        }


        /*
           طبقة داكنة تجعل النص واضحًا
           وتحافظ على ظهور السيارة
        */

        .background::after {

            content: "";

            position: absolute;

            inset: 0;

            background:
                linear-gradient(
                    to bottom,
                    rgba(0, 20, 14, 0.25) 0%,
                    rgba(0, 24, 16, 0.34) 42%,
                    rgba(0, 16, 11, 0.64) 100%
                );
        }


        /* ==============================
           البطاقة الخضراء
        ============================== */

      .content-card {
             position: relative;

             width: min(820px, 88vw);

             transform: translateY(-115px);

    padding:
         clamp(24px, 4vw, 42px)
         clamp(25px, 5vw, 55px)
         20px;

     text-align: center;

     color: #ead8ad;

     border-radius: 30px;

     border: 1.5px solid
        rgba(255, 247, 215, 0.80);

    background:
         linear-gradient(
            145deg,
            rgba(0, 68, 45, 0.86),
            rgba(0, 42, 30, 0.80)
        );

            box-shadow:
                0 25px 70px rgba(0, 0, 0, 0.34),
                inset 0 0 35px rgba(255, 255, 255, 0.035);

            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);

            overflow: hidden;

            opacity: 0;

            transform: translateY(30px);

            animation:
                cardEnter 1.2s ease-out 0.25s forwards;
        }


        /* ==============================
           العلم داخل البطاقة
        ============================== */

        .flag-layer {

            position: absolute;

            inset: 0;

            background-image:
                url("saudi-flag-background.jpg");

            background-size: cover;

            background-position: center;

            opacity: 0.16;

            z-index: -1;

            transform: scale(1.06);

            animation:
                flagMove 12s ease-in-out infinite alternate;
        }


        /* طبقة إضافية لزيادة وضوح النص */

        .content-card::after {

            content: "";

            position: absolute;

            inset: 0;

            background:
                linear-gradient(
                    to bottom,
                    rgba(0, 30, 20, 0.08),
                    rgba(0, 25, 18, 0.28)
                );

            pointer-events: none;

            z-index: -1;
        }


        /* ==============================
           العبارة
        ============================== */

        .quote {

            position: relative;

            z-index: 2;

            max-width: 780px;

            margin: 0 auto;

            font-size:
                clamp(22px, 3.3vw, 43px);

            line-height: 1.7;

            font-weight: 700;

            color: #ead8ad;

            text-shadow:
                0 2px 4px rgba(0, 0, 0, 0.35);

            opacity: 0;

            transform: translateY(18px);

            animation:
                textEnter 1.25s ease-out 0.75s forwards;
        }


        /* ==============================
           الفاصل
        ============================== */

        .divider {

            width: 0;

            height: 1px;

            margin: 30px auto 25px;

            background:
                linear-gradient(
                    to right,
                    transparent,
                    rgba(255, 247, 215, 0.95),
                    transparent
                );

            animation:
                dividerEnter 1.1s ease 1.45s forwards;
        }


        /* ==============================
           الصوت
        ============================== */

        .audio-area {

            position: relative;

            z-index: 3;

            display: flex;

            flex-direction: column;

            align-items: center;

            gap: 9px;

            opacity: 0;

            transform: translateY(15px);

            animation:
                audioEnter 1s ease-out 1.7s forwards;
        }


        .audio-btn {
    width: 74px;
    height: 74px;
    border-radius: 50%;

    border: 2px solid #ead8ad;
    background: rgba(0, 35, 25, 0.48);
    color: #ead8ad;

    display: flex;
    justify-content: center;
    align-items: center;

    cursor: pointer;
    padding: 0;

    transition:
        transform 0.3s ease,
        background 0.3s ease,
        box-shadow 0.3s ease;
}


        .audio-btn:hover {

            transform: scale(1.08);

            background:
                rgba(255, 255, 255, 0.13);

            box-shadow:
                0 0 25px rgba(255, 245, 205, 0.22);
        }


        .audio-btn:active {

            transform: scale(0.96);
        }


        .play-icon {
    display: block;

    width: 0;
    height: 0;

    border-top: 9px solid transparent;
    border-bottom: 9px solid transparent;
    border-left: 15px solid #ead8ad;

    margin-left: 4px;

    font-size: 0;
}
        .play-icon.paused {
    width: 16px;
    height: 20px;

    border: none;
    margin-left: 0;

    position: relative;
}

.play-icon.paused::before,
.play-icon.paused::after {
    content: "";
    position: absolute;

    top: 0;

    width: 5px;
    height: 20px;

    background: #ead8ad;
    border-radius: 1px;
}

.play-icon.paused::before {
    left: 1px;
}

.play-icon.paused::after {
    right: 1px;
}


        .listen {

            font-size: 18px;

            color: #fff8e7;

            letter-spacing: 0.2px;
        }


        /* ==============================
           الحقوق
        ===================== ========= */
    
   .rights {
    position: relative;
    z-index: 3;
    margin-top: 18px;

    font-family: Arial, sans-serif;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 1.2px;

    color: #EAD8AD;
    direction: ltr;
    unicode-bidi: isolate;
    white-space: nowrap;
    text-align: center;

    opacity: 0;
    animation: rightsEnter 1s ease-out 2s forwards;
}
        /* ==============================
           الانتقالات
        ============================== */

        @keyframes backgroundEnter {

            from {
                opacity: 0;
                transform: scale(1.10);
            }

            to {
                opacity: 1;
                transform: scale(1.04);
            }
        }


        @keyframes cardEnter {

            from {
                opacity: 0;
                transform:
                    translateY(30px)
                    scale(0.98);
            }

            to {
                opacity: 1;
                transform:
                    translateY(0)
                    scale(1);
            }
        }


        @keyframes textEnter {

            from {
                opacity: 0;
                transform: translateY(18px);
                filter: blur(3px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
                filter: blur(0);
            }
        }


        @keyframes dividerEnter {

            from {
                width: 0;
                opacity: 0;
            }

            to {
                width: 46%;
                opacity: 1;
            }
        }


        @keyframes audioEnter {

            from {
                opacity: 0;
                transform: translateY(15px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }


        @keyframes rightsEnter {

            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }


        @keyframes flagMove {

            from {
                transform:
                    scale(1.06)
                    translateX(-5px);
            }

            to {
                transform:
                    scale(1.10)
                    translateX(5px);
            }
        }


        /* ==============================
           الجوال
        ============================== */

        @media (max-width: 600px) {

            .page {

                padding:
                    24px 15px;
            }


            .background {

                background-position:
                    52% center;
            }


            .content-card {

                width: 94vw;

                border-radius: 23px;

                padding:
                    36px 20px
                    27px;
            }


            .quote {

                font-size:
                    clamp(19px, 5.4vw, 25px);

                line-height: 1.95;
            }


            .divider {

                margin:
                    23px auto
                    20px;
            }


            .audio-btn {

                width: 64px;

                height: 64px;

                font-size: 22px;
            }


            .listen {

                font-size: 16px;
                color: #ead8ad;
            }


            .rights {

                margin-top: 22px;

                font-size: 10px;

                letter-spacing: 1px;
            }
        }


        /* ==============================
           احترام إعداد تقليل الحركة
        ============================== */

        @media
        (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {

                animation-duration:
                    0.01ms !important;

                animation-iteration-count:
                    1 !important;

                transition-duration:
                    0.01ms !important;
            }
        }

    </style>
</head>


<body>


    <main class="page">


        <!-- صورة سيارة الأمن -->

        <div class="background"></div>


        <!-- البطاقة -->

        <section class="content-card">


            <!-- العلم السعودي الشفاف -->

            <div class="flag-layer"></div>

            <!-- النص -->

            <p class="quote">

               وَطَنِي مَصْدَرُ شُمُوخِي، وَخِدْمَتُهُ غَايَةُ طُمُوحِي؛<br>
               بِالعِلْمِ وَالمَسْؤُولِيَّةِ أَمْضِي،<br>
            وَأَسْعَى لِبِنَاءِ قَوَاعِدِ بَيَانَاتٍ آمِنَةٍ وَحُلُولٍ ذَكِيَّةٍ تَخْدِمُ الجِهَاتِ الحُكُومِيَّةَ
            </p>


            <!-- الفاصل -->

            <div class="divider"></div>


            <!-- الصوت -->

            <div class="audio-area">

                <button
                    class="audio-btn"
                    id="audioBtn"
                    type="button"
                    aria-label="تشغيل الصوت">

                    <span
                        class="play-icon"
                        id="playIcon">

                        ▶️

                    </span>

                </button>


                <span class="listen">

                    استمع

                </span>

            </div>


            <!-- الحقوق -->

          <p class="rights" dir="ltr">
          ©️ 2026 NMS · PERSONAL PROJECT
        </p>

         

            


        </section>


    </main>


    <!-- ملف الصوت -->

    <audio id="nationalAudio" preload="auto">
    <source src="audio.mp3" type="audio/mpeg">
</audio>


    <script>

        const audio =
            document.getElementById(
                "nationalAudio"
            );


        const audioBtn =
            document.getElementById(
                "audioBtn"
            );


        const playIcon =
            document.getElementById(
                "playIcon"
            );


        audioBtn.addEventListener(
            "click",
            function () {

                if (audio.paused) {

                    audio.play();

                } else {

                    audio.pause();

                }

            }
        );


        audio.addEventListener(
            "play",
            function () {

               playIcon.classList.add("paused");

                audioBtn.setAttribute(
                    "aria-label",
                    "إيقاف الصوت مؤقتًا"
                );

            }
        );


        audio.addEventListener(
            "pause",
            function () {

                playIcon.classList.remove("paused");

                audioBtn.setAttribute(
                    "aria-label",
                    "تشغيل الصوت"
                );

            }
        );


        audio.addEventListener(
            "ended",
            function () {

                playIcon.classList.remove("paused");

                audioBtn.setAttribute(
                    "aria-label",
                    "تشغيل الصوت"
                );

            }
        );

    </script>


</body>

</html>
