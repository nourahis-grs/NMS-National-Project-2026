
<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NMS | عزّنا بطبعنا</title>

    <style>

        /* =========================================
           خط ثمانية
        ========================================= */

        @font-face {
            font-family: "Thmanyah";
            src: url("thmanyah-font-family-Bold.woff2") format("woff2");
            font-weight: 700;
            font-style: normal;
        }


        /* =========================================
           الإعدادات العامة
        ========================================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            font-family: "Thmanyah", Arial, sans-serif;
            background: #062f27;
        }


        /* =========================================
           الصفحة الرئيسية
        ========================================= */

        .hero {
            position: relative;

            width: 100%;
            min-height: 100vh;
            min-height: 100svh;

            display: flex;
            justify-content: center;
            align-items: center;

            overflow: hidden;

            background: #062f27;
        }


        /* =========================================
           خلفية الفتاة
        ========================================= */

        .girl-background {
            position: absolute;
            inset: 0;

            width: 100%;
            height: 100%;

            background-image: url("girl-background.jpeg");
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;

            z-index: 1;
        }


        /* =========================================
           طبقة خضراء خفيفة
           للحفاظ على وضوح الصورة
        ========================================= */

        .green-overlay {
            position: absolute;
            inset: 0;

            z-index: 2;

            background:
                linear-gradient(
                    180deg,
                    rgba(3, 50, 40, 0.10) 0%,
                    rgba(3, 53, 42, 0.16) 35%,
                    rgba(2, 47, 37, 0.28) 65%,
                    rgba(0, 31, 24, 0.58) 100%
                );
        }


        /* =========================================
           ظل سفلي
        ========================================= */

        .bottom-shadow {
            position: absolute;

            left: 0;
            right: 0;
            bottom: 0;

            height: 42%;

            z-index: 3;

            pointer-events: none;

            background:
                linear-gradient(
                    to bottom,
                    transparent 0%,
                    rgba(0, 25, 19, 0.20) 25%,
                    rgba(0, 25, 19, 0.68) 100%
                );
        }


        /* =========================================
           المحتوى الرئيسي
        ========================================= */

        .content {
            position: relative;
            z-index: 10;

            width: min(92%, 720px);

            display: flex;
            flex-direction: column;

            align-items: center;
            justify-content: center;

            text-align: center;

            padding: 32px 20px;
        }


        /* =========================================
           شعار NMS
        ========================================= */

       .nms-logo {
           display: block;
           width: 78px;
           height: auto;
           margin: 0 auto 0;
           position: relative;
           left: 23px;
           filter: drop-shadow(0 6px 12px rgba(0, 0, 0, 0.32));
           animation: logoAppear 1.1s ease both;
       }

        /* =========================================
           عزّنا بطبعنا
        ========================================= */

        .title {
            direction: rtl;
            text-align: center;
            position: relative;
            left: 32px;
            color: #ead8ad;
            font-family: "Thmanyah", Arial, sans-serif;
            font-size: clamp(30px, 4.6vw, 46px);
            font-weight: 700;
            line-height: 1.2;
            margin: 0 0 14px;
            text-shadow:
                0 2px 3px rgba(0, 0, 0, 0.55),
                0 5px 10px rgba(0, 0, 0, 0.22);
           animation: fadeUp 1s ease 0.15s both;
        }


        /* =========================================
           الفاصل الذهبي
        ========================================= */

        .divider {
            width: min(60%, 400px);

            display: flex;
         align-items: center;
            justify-content: center;

            gap: 14px;
            margin-bottom: 20px;

            animation:
                fadeUp 1s ease 0.28s both;
        }


        /* =========================================
           الخط الأيسر
        ========================================= */

        .divider-line {
    flex: none;
    width: 80px;
    height: 1px;

    background: linear-gradient(
        to right,
        transparent,
        rgba(226, 202, 145, 0.95)
    );
    }

.divider-line.right {
    flex: none;
    width: 42px;

    background: linear-gradient(
        to left,
        transparent,
        rgba(226, 202, 145, 0.95)
    );
    }


        /* =========================================
           الخط الأيمن
        ========================================= */

        .divider-line.right {
            flex: none;
            width: 42px;
            background:
                linear-gradient(
                    to left,
                    transparent, 
                    rgba(226, 202, 145, 0.95)
     );   
    }


        /* =========================================
           السيفان والنخلة
        ========================================= */

        .saudi-emblem {
            width: 60px;
            height: 60px;

            object-fit: contain;

            flex-shrink: 0;

            display: block;

              
    }
        /* =========================================
           الاسم
        ========================================= */

        .name {
            direction: ltr;
            position: relative;
            width: 100%;
            color: #ead8ad;

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            font-size:
                clamp(16px, 2.25vw,22px);

            font-weight: 600;

            letter-spacing: 1px;

            line-height: 1.35;

            white-space: nowrap;

            text-transform: uppercase;

            margin-bottom: 8px;

            text-shadow:
                0 3px 7px
                rgba(0, 0, 0, 0.68);

            animation:
                fadeUp 1s ease 0.40s both;
        }


        /* =========================================
           التخصص
        ========================================= */

        .specialty {
            direction: ltr;

            color: #e6d6ae;

            font-family:
                Arial,
                sans-serif;

            font-size:
                clamp(10px, 1.55vw, 14px);

            font-weight: 500;

            letter-spacing: 3.5px;

            text-transform: uppercase;

            margin-bottom: 14px;

            text-shadow:
                0 2px 6px
                rgba(0, 0, 0, 0.62);

            animation:
                fadeUp 1s ease 0.50s both;
        }


        /* =========================================
           زر استعرض المشاركة
        ========================================= */

        .view-button {
    direction: rtl;

    width: min(46%, 280px);
    padding: 9px 20px;

    border: 1px solid #dfca96;
    border-radius: 50px;

    background: rgba(8, 83, 63, 0.82);
    color: #f1e4c2;

    font-family: "Thmanyah", Arial, sans-serif;
    font-size: clamp(16px, 2.3vw, 19px);
    font-weight: 700;

    text-align: center;
    text-decoration: none;

    backdrop-filter: blur(5px);
    -webkit-backdrop-filter: blur(5px);

    box-shadow: 0 5px 16px rgba(0, 0, 0, 0.25);

    transition:
        transform 0.25s ease,
        background 0.25s ease,
        box-shadow 0.25s ease;

    position: relative;
    left: 3%;

    animation: fadeUp 1s ease 0.62s both;
}


        .view-button:hover {
            transform:
                translateY(-2px);

            background:
                rgba(8, 83, 63, 0.92);

            box-shadow:
                0 9px 20px
                rgba(0, 0, 0, 0.30);
        }


        /* =========================================
           الحركات
        ========================================= */

        @keyframes fadeUp {

            from {
                opacity: 0;

                transform:
                    translateY(16px);
            }

            to {
                opacity: 1;

                transform:
                    translateY(0);
            }
        }


        @keyframes logoAppear {

            from {
                opacity: 0;

                transform:
                    scale(0.94);
            }

            to {
                opacity: 1;

                transform:
                    scale(1);
            }
        }


        /* =========================================
           تحسين شاشة الجوال
        ========================================= */

        @media (max-width: 600px) {

            .content {
                width: 88%;
                max-width: 430px;
                padding: 20px 10px;
                margin: 0 auto;
                
            }

            .nms-logo {
                width: 135px;
                margin-bottom: 16px;
            }


            .title {
                font-size: 38px;
                margin-bottom: 20px;
            }


            .divider {
                width: 62%;
                max-width: 330px;
                gap: 10px;
                margin-bottom: 18px;
                position: relative;
                left: 10%;
            }

             .divider-line {
                  width: 55px;
           } 

             .divider-line.right {
                  width: 70px;
           }

            .saudi-emblem {
               width: 52px;
              height: 52px;
            }


            .saudi-emblem {
                width: 52px;
                height: 52px;
            }


            .name {
                 font-size: 11px;
                 letter-spacing: 0.3px;
                 white-space: nowrap;
                 text-align: center;
                 width: 100%;
                 margin: 0 0 2px 0;
                 line-height: 1.15;
                 position: relative;
                 left: 13%;
            }

            .specialty {
                font-size: 8px;
                letter-spacing: 1.5px;
                white-space: nowrap;
                text-align: center;
                width: 100%;
                margin: 0 0 18px 0;
                line-height: 1.15;
                position: relative;
                left: 13%;
            }

         .view-button {
              display: block;
              width: 43%;
              max-width: 200px;
              padding: 6px 10px;
              font-size: 11px;
              margin: 0 auto;
              line-height: 1.2;
              border-radius: 20px;
              position: relative;
              left: 13%;
            }
        

        /* =========================================
           الشاشات الصغيرة جدًا
        ========================================= */

        @media (max-width: 390px) {

        .name {
        font-size: 12px;
        letter-spacing: 0.4px;
        white-space: nowrap;
        text-align: center;
        width: 100%;
        margin: 0 0 3px 0;
        line-height: 1.2;
    }

.specialty {
    font-size: 9px;
    letter-spacing: 1.5px;
    white-space: nowrap;
    text-align: center;
    width: 100%;
    margin: 0 0 16px 0;
    line-height: 1.2;
    }

.view-button {
    display: block;
    width: 46%;
    max-width: 210px;
    padding: 7px 12px;
    font-size: 12px;
    margin: 0 auto;
    line-height: 1.2;
    border-radius: 20px;
    }
    .saudi-emblem {
        width: 46px;
        height: 46px;
    }
}
    }
    </style>

</head>


<body>

    <main class="hero">


        <!-- خلفية الفتاة -->

        <div class="girl-background"></div>


        <!-- الطبقة الخضراء -->

        <div class="green-overlay"></div>


        <!-- الظل السفلي -->

        <div class="bottom-shadow"></div>



        <!-- المحتوى -->

        <section class="content">


            <!-- شعار NMS -->

            <img
                src="NMS_Logo.png"
                alt="NMS Logo"
                class="nms-logo"
            >


            <!-- العنوان -->

            <h1 class="title">
                عِزُّنَا بِطَبْعِنَا
            </h1>


            <!-- الفاصل + شعار المملكة -->

            <div class="divider">

                <span class="divider-line"></span>

                <img
                    src="saudi-emblem.jpeg"
                    alt="Saudi Emblem"
                    class="saudi-emblem"
                >

                <span class="divider-line right"></span>

            </div>


            <!-- الاسم -->

            <h2 class="name">
                NOURAH MOHSEN ALSHAHRANI
            </h2>


            <!-- التخصص -->

            <p class="specialty">
                INFORMATION SYSTEMS
            </p>


            <!-- الانتقال للصفحة الثانية -->

            <a
                href="Page2.html"
                class="view-button"
            >
                استعرض المشاركة
            </a>


        </section>

    </main>

</body>

</html>
